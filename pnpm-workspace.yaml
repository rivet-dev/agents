# Root workspace. Sandbox Agent keeps its own pnpm workspace in sandbox-agent/
# because its Dockerfiles build from that directory as the context root.
packages:
  - packages/*
  - packages/pi/tests/published-0.5.5
  - examples/*
  - scripts/release
  - scripts/pipboy

onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - lefthook
