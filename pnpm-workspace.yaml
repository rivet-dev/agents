# Root workspace. Sandbox Agent keeps its own pnpm workspace in sandbox-agent/
# because its Dockerfiles build from that directory as the context root.
packages:
  - packages/*
  - packages/pi/tests/published-0.5.5
  - examples/*
  - scripts/release
  - scripts/pipboy

allowBuilds:
  '@google/genai': false
  better-sqlite3: false
  cbor-extract: false
  esbuild: true
  lefthook: true
  protobufjs: false

# pnpm 11 guesses libc from an optional package's name when its lockfile entry
# has none, so on glibc it skips `@rivetkit/engine-cli-linux-x64-musl`. That
# binary is static musl and runs on glibc, so accept musl packages too.
supportedArchitectures:
  libc: [current, musl]
